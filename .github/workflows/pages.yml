name: Deploy React app to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: CI=false npm run build   # <-- forces CI to false

      - name: Detect build directory
        id: detect
        run: |
          if [ -d dist ]; then
            echo "out=dist" >> $GITHUB_OUTPUT
          elif [ -d build ]; then
            echo "out=build" >> $GITHUB_output
          else
            echo "No dist/ or build/ folder found after npm run build"
            exit 1
          fi

      - name: Add 404.html for SPA routing
        run: cp ${{ steps.detect.outputs.out }}/index.html ${{ steps.detect.outputs.out }}/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.out }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
